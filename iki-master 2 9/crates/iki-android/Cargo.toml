[package]
name = "iki-android"
description = "JNI bridge between the Iki kernel (iki-core) and the native Android frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "iki"
crate-type = ["cdylib", "rlib"]

[dependencies]
iki-core = { path = "../iki-core" }
jni = "0.21"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
