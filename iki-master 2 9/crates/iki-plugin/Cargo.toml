[package]
name = "iki-plugin"
description = "Iki as a VST3 / CLAP instrument plugin (Ableton Live, Bitwig, Reaper, …)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The VST3 bindings nih-plug uses are GPLv3, so the plugin binary is too. The
# kernel and UI crates it links stay proprietary.
license = "GPL-3.0-or-later"

[lib]
name = "iki_plugin"
crate-type = ["cdylib", "lib"]

[features]
# Debug builds panic on any allocation inside `process()` (used by the tests).
assert_process_allocs = ["nih_plug/assert_process_allocs"]

[dependencies]
iki-core = { path = "../iki-core", default-features = false }
iki-ui = { path = "../iki-ui" }
# nih-plug at the revision the egui 0.33 editor adapter (nih_plug_egui from
# egui-baseview) is built against, so both see the same plugin types.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "28b149ec4d62757d0b448809148a0c3ca6e09a95", default-features = false, features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "11f487fe915d6208961064e619474b98f971594a" }
rtrb = "0.3"
serde_json = "1"
