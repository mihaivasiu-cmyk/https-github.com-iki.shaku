[workspace]
resolver = "3"
members = ["crates/iki-core", "crates/iki-ui", "crates/iki-desktop", "crates/iki-android", "crates/iki-plugin", "crates/iki-ios"]
# `cargo run` / `cargo build` at the root build the desktop app.
default-members = ["crates/iki-desktop"]
# Self-contained offline test harness with its own workspace (see TESTING.md).
exclude = ["tools/offline-check"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "LicenseRef-Proprietary"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
